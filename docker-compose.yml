services:
  db:
    image: pgvector/pgvector:0.8.6-pg18-trixie
    container_name: mkst_postgresql
    restart: always
    environment:
      POSTGRES_USER: "${DB_USER_ID}"
      POSTGRES_PASSWORD: "${DB_USER_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
      TZ: Asia/Seoul
      LANG: C.UTF-8
      LC_ALL: C.UTF-8
    ports:
      - "${DB_HOST}:${DB_PORT}:5432"
    networks:
      - mkst-network
    volumes:
      - mkst_postgresql_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER_ID} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5

networks:
  mkst-network:
    driver: bridge

volumes:
  mkst_postgresql_data:
